<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Question Bank · WBPSC Clerkship English</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/test.css">
  <script>
    try {
      document.documentElement.dataset.theme = JSON.parse(localStorage.getItem("wbpsc-theme") || '"light"');
    } catch(e) {
      document.documentElement.dataset.theme = "light";
    }
  </script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="nav-root"></div>
  <main id="main" class="page">
    <header class="page-header">
      <p class="eyebrow">Comprehensive Practice</p>
      <h1>Question Bank</h1>
      <p id="bank-count">Loading questions from syllabus…</p>
    </header>
    <section class="card filters" aria-label="Question filters">
      <div style="grid-column: 1 / -1; margin-bottom: 0.5rem;">
        <input type="search" id="keyword-filter" placeholder="🔍 Search question text, rules, or grammar topics…" style="width:100%; min-height:44px; border:1px solid var(--border); border-radius:8px; padding:0.65rem 0.85rem; background:var(--surface); color:var(--text);">
      </div>
      <label>Section
        <select id="section-filter" data-filter="section">
          <option value="all">All sections</option>
          <option value="grammar">Grammar</option>
          <option value="vocabulary">Vocabulary</option>
          <option value="reading">Reading</option>
        </select>
      </label>
      <label>Chapter
        <select id="chapter-filter" data-filter="chapter">
          <option value="all">All chapters</option>
        </select>
      </label>
      <label>Type
        <select id="type-filter" data-filter="type">
          <option value="all">All types</option>
        </select>
      </label>
      <label>Difficulty
        <select id="difficulty-filter" data-filter="difficulty">
          <option value="all">All levels</option>
          <option value="easy">Easy</option>
          <option value="medium">Medium</option>
          <option value="hard">Hard</option>
        </select>
      </label>
      <label>Status
        <select id="group-filter" data-filter="group">
          <option value="all">All questions</option>
          <option value="bookmarked">Bookmarked</option>
          <option value="wrong">Previously wrong</option>
          <option value="unattempted">Unattempted</option>
        </select>
      </label>
    </section>
    <div id="bank-root" aria-live="polite"></div>
  </main>
  <script src="js/storage.js"></script>
  <script src="js/bookmarks.js"></script>
  <script src="js/app.js"></script>
  <script src="js/question-bank.js"></script>
</body>
</html>
