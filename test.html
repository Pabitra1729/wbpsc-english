<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Test · WBPSC Clerkship English</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/test.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="nav-root"></div>
  <main id="main" class="page test-layout">
    <header class="test-header card">
      <div><p class="eyebrow" id="test-category">Test</p><h1 id="test-title">English practice test</h1></div>
      <div class="timer" id="timer" role="timer" aria-live="polite">00:00</div>
    </header>
    <div class="test-body">
      <section id="question-area" class="card" aria-live="polite"></section>
      <aside class="test-sidebar card" aria-label="Question palette">
        <h2>Question palette</h2>
        <div id="palette" class="palette"></div>
        <div class="palette-legend">
          <span><i class="status answered"></i>Answered</span>
          <span><i class="status marked"></i>Marked</span>
          <span><i class="status current"></i>Current</span>
        </div>
        <button id="submit-test" class="btn primary full-width" type="button">Submit test</button>
      </aside>
    </div>
  </main>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
  <script src="js/test-engine.js"></script>
</body>
</html>
